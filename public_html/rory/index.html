<html>
  <style>
    body {
	overflow: hidden;
	margin: 0;
    }
    #container {
	position: absolute;
	width: 100vw;
	height: 100vh;
	display: flex;
	flex-wrap: wrap;
    }
    #container * {
	flex-grow: 1;
	border: none;
    }
  </style>
  <body>
    <div id="container"></div>
  </body>
</html>

<script>
  const links = [
      'hogwild.uk',
      'seasoning.live',
      'harmonicon.co.uk',
      'wiki.hogwild.uk',
      'rory.hogwild.uk',
      'hogwild.uk/mealdeal',
      'hogwild.uk/hog-fishing',
      'hogwild.uk/newno',
      'hogwild.uk/notoalgorithms',
      'otalaband.com',
      'valve.hogwild.uk',
      'tyoc.hogwild.uk'
  ];
  const container = document.getElementById('container');
  for (link of links){
      const frame = document.createElement('iframe');
      frame.src = 'https://' + link;
      container.appendChild(frame);
  }
</script>
